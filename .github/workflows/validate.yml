name: Validate profile assets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/render_city.py
      - run: python scripts/validate_profile.py
      - run: git diff --exit-code -- assets/contribution-city-dark.svg assets/contribution-city-light.svg
