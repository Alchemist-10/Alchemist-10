name: Refresh contribution city
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-city
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch real activity and render both themes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/render_city.py --refresh
      - name: Commit refreshed assets when data changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json assets/contribution-city-dark.svg assets/contribution-city-light.svg
          if git diff --cached --quiet; then
            echo 'Calendar unchanged.'
          else
            git commit -m 'chore: refresh contribution city'
            git push
          fi
